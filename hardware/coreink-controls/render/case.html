<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script type="importmap">{"imports": {"three": "./node_modules/three/build/three.module.js",
 "three/addons/": "./node_modules/three/examples/jsm/"}}</script>
<style>body{margin:0;background:#f4f4f2}canvas{display:block}</style></head>
<body>
<script type="module">
// Renders ../case.py's parts (mm): X across the face, Y up it, Z out of it. The CoreInk is turned over.
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
const W = 640, H = 560;
const view = new URLSearchParams(location.search).get('view') || 'front';
const C = await (await fetch('case.json')).json();
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2); renderer.setSize(W, H); renderer.setClearColor(0xf4f4f2);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x50565f, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 2.8); key.position.set(-110, 120, 150); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 1.0); fill.position.set(120, -20, -60); scene.add(fill);
const loader = new STLLoader();
const load = (f) => new Promise((ok, bad) => loader.load(f, g => { g.computeVertexNormals(); ok(g); }, undefined, bad));
const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.7, ...extra });
const g = new THREE.Group(); scene.add(g);
const add = async (file, material) => { const m = new THREE.Mesh(await load(file), material); g.add(m); return m; };
const xray = view === 'xray', cut = view.startsWith('cut');
const shellMat = xray ? mat(0x2b2e33, { roughness: 0.8, transparent: true, opacity: 0.22, depthWrite: false })
                      : mat(0x2b2e33, { roughness: 0.8, side: THREE.DoubleSide });
await add(cut ? 'model-case-cut.stl' : 'model-case-body.stl', shellMat);
await add('model-case-stick.stl', mat(0x55595f, { roughness: 0.6 }));
await add('model-case-button.stl', mat(0xd9542b, { roughness: 0.5 }));
// the CoreInk, turned over
const dev = await load('model-coreink.stl');
dev.translate(-2.5, -2.5, -2.5); dev.rotateZ(Math.PI); dev.translate(C.device.w + C.device.x0, C.device.h + C.device.y0, C.device.z0);
const devMesh = new THREE.Mesh(dev, mat(0xe9e9e4, { roughness: 0.5, ...(cut ? { transparent: true, opacity: 0.35, depthWrite: false } : {}) }));
g.add(devMesh);
const tex = await new THREE.TextureLoader().loadAsync('screen.png'); tex.colorSpace = THREE.SRGBColorSpace;
const scr = new THREE.Mesh(new THREE.PlaneGeometry(27.6, 27.6), new THREE.MeshBasicMaterial({ map: tex }));
scr.position.set(...C.screen); g.add(scr);           // upright: the firmware turns the picture over

// --- the parts inside: the header and its plugs, the wires down the conduit, the 5-way board, the switch
if (xray || cut) {
  const I = C.inside, gold = { metalness: 0.8, roughness: 0.3 };
  const box = (w, h, d, color, x, y, z, extra = {}) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, extra)); m.position.set(x, y, z); g.add(m); return m; };
  const rod = (a, b, r, color, extra = {}) => {
    const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), len = A.distanceTo(B);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 16), mat(color, extra));
    m.position.copy(A.clone().add(B).multiplyScalar(0.5));
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize()); g.add(m); return m;
  };
  const H_ = I.header, zb = H_.z_back;
  const ys = H_.pins.map(p => p.y);
  box(H_.body_x[1] - H_.body_x[0], Math.max(...ys) - Math.min(...ys) + 2.54, 5.1, 0x1b1c1f,
      (H_.body_x[0] + H_.body_x[1]) / 2, (Math.max(...ys) + Math.min(...ys)) / 2, zb - 2.55);
  const colours = { gnd: 0x202124, vcc: 0xd93025, up: 0xf6c026, down: 0x34a853, left: 0x4285f4, right: 0xa142f4, centre: 0xff8c1a, time: 0xffffff };
  const P = I.pmd, T_ = I.tact;
  for (const pin of H_.pins) {
    rod([pin.socket_x, pin.y, zb + 2.5], [pin.socket_x, pin.y, pin.z], 0.32, 0xd4af37, gold);       // leg, into the socket
    rod([pin.socket_x, pin.y, pin.z], [H_.body_x[0], pin.y, pin.z], 0.32, 0xd4af37, gold);           // the bend
    box(H_.plug_x[1] - H_.plug_x[0], 2.5, 2.5, 0x18191b, (H_.plug_x[0] + H_.plug_x[1]) / 2, pin.y, pin.z, { roughness: 0.8 });
    // the wire: out of the plug, along the pocket, down the conduit, behind the board to its pad
    const [ex, ey] = I.ends[pin.what];
    const toTact = pin.what === 'time';
    const endZ = toTact ? T_.z + 1.0 : P.z - 0.1;
    const zw = I.wire_z + 0.4 + (pin.n % 4) * 0.7;
    const pts = [[H_.plug_x[0], pin.y, pin.z], [H_.plug_x[0] - 3, pin.y - 0.5, zw + 1],
                 [I.conduit_x - 1.5 + (pin.n % 5) * 0.8, Math.min(...ys) - 3, zw],
                 [I.conduit_x - 1.5 + (pin.n % 5) * 0.8, I.shoulder - I.ramp - 4, zw],
                 [ex, (toTact ? T_.y + 8 : ey + 4), zw], [ex, ey, endZ]];
    const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)), false, 'centripetal');
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 120, 0.5, 10, false), mat(colours[pin.what], { roughness: 0.5 })));
  }
  // the button's ground: a short wire from the board's GND pad to the switch's other leg
  const gp = I.ends.gnd, gl = T_.gnd_leg;
  const link = new THREE.CatmullRomCurve3([[gp[0], gp[1], P.z - 0.1], [gp[0], gp[1] + 3, I.wire_z + 0.6], [gl[0], T_.y + 8, I.wire_z + 0.6], [gl[0], gl[1], T_.z + 1.0]]
    .map(p => new THREE.Vector3(...p)), false, 'centripetal');
  g.add(new THREE.Mesh(new THREE.TubeGeometry(link, 60, 0.5, 10, false), mat(0x202124)));
  // the 5-way board (turned round: pads toward the CoreInk), its switch, stem and resistors
  box(P.w, P.h, P.t, 0xc0262d, P.x, P.y, P.z + P.t / 2, { roughness: 0.5 });
  box(P.switch[0], P.switch[0], P.switch[1], 0xb8bcc2, P.x, P.y, P.z + P.t + P.switch[1] / 2, { metalness: 0.6, roughness: 0.35 });
  box(P.stem[0], P.stem[0], P.stem[1], 0x1b1c1f, P.x, P.y, P.z + P.t + P.switch[1] + P.stem[1] / 2);
  for (let i = 0; i < 5; i++) box(1.0, 2.0, 0.5, 0x222222, P.x + (i - 2) * 2.54, P.y + P.h / 2 - 4.6, P.z + P.t + 0.25);
  for (let i = 0; i < 7; i++) { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.2, 16), mat(0xd4af37, gold)); m.rotation.x = Math.PI / 2; m.position.set(P.x + (i - 3) * 2.54, P.y + P.h / 2 - 1.6, P.z + P.t + 0.1); g.add(m); }
  // the tactile switch on its shelf, its four legs
  box(T_.size[0], T_.size[0], T_.size[1], 0x2b2e33, T_.x, T_.y, T_.z + T_.size[1] / 2);
  const act = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, T_.size[2], 24), mat(0x1b1c1f)); act.rotation.x = Math.PI / 2;
  act.position.set(T_.x, T_.y, T_.z + T_.size[1] + T_.size[2] / 2); g.add(act);
  for (const sx of [-1, 1]) for (const sy of [-1, 1])
    rod([T_.x + sx * (T_.size[0] / 2 + 0.3), T_.y + sy * 2.5, T_.z + 1.5], [T_.x + sx * (T_.size[0] / 2 + 0.3), T_.y + sy * 2.5, T_.z - 1.5], 0.35, 0xc0c4c8, gold);
}
if (view.startsWith('broom') || view === 'side') {
  await add('model-case-handle.stl', mat(0xe9e6df, { roughness: 0.4 }));
  await add('model-case-strap.stl', mat(0x1c1d20, { roughness: 0.95 }));
}
g.position.set(-C.W / 2, -C.H / 2, -C.T / 2);
const views = {
  front: [[55, 40, 230], [0, 0, 0]],
  face: [[0, 0, 240], [0, 0, 0]],
  top: [[-40, 140, 120], [0, 40, 0]],
  left: [[-200, 30, 80], [0, 5, 0]],
  side: [[230, 20, 10], [0, 0, -8]],
  broom: [[160, 40, 200], [0, -5, -10]],
  'broom-hand': [[-40, -190, 170], [0, 5, -6]],
  back: [[-60, 30, -220], [0, 0, -4]],
  xray: [[-60, 40, 200], [0, 0, 0]],
  cut: [[150, 25, 45], [0, -6, 0]],
  'cut-tail': [[120, 10, 40], [0, -32, 0]],
};
const [pos, look] = views[view] || views.front;
const cam = new THREE.PerspectiveCamera(30, W / H, 1, 3000);
cam.position.set(...pos); cam.lookAt(...look);
renderer.render(scene, cam);
document.title = 'done';
</script></body></html>

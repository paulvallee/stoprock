<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script type="importmap">{"imports": {"three": "./node_modules/three/build/three.module.js",
 "three/addons/": "./node_modules/three/examples/jsm/"}}</script>
<style>body{margin:0;background:#f4f4f2}canvas{display:block}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
const W = 640, H = 560;
const params = new URLSearchParams(location.search);
const view = params.get('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2);
renderer.setSize(W, H);
renderer.setClearColor(0xf4f4f2);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x50565f, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 3.4); key.position.set(-110, 90, 60); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.7); rim.position.set(-80, -40, -60); scene.add(rim);
const loader = new STLLoader();
const load = (f) => new Promise(r => loader.load(f, g => { g.computeVertexNormals(); r(g); }));
const [tub, bez] = await Promise.all([load('stoprock-case-tub.stl'), load('stoprock-case-bezel.stl')]);
const tubMat = new THREE.MeshStandardMaterial({ color: 0x3b3f46, roughness: 0.75, metalness: 0.0 });
const bezMat = new THREE.MeshStandardMaterial({ color: 0x6a717b, roughness: 0.6, flatShading: true });
const devMat = new THREE.MeshStandardMaterial({ color: 0xe9e9e4, roughness: 0.5 });
const scrMat = new THREE.MeshStandardMaterial({ color: 0xd9d6cf, roughness: 0.9 });
const group = new THREE.Group(); scene.add(group);
// STL coordinates: the tub as modelled (x, y, z with z = thickness); the bezel was exported face-down
const tubMesh = new THREE.Mesh(tub, tubMat);
// tub STL was shifted so its bounds start at 0: the lanyard loop pokes out at x<0, y>CH
tub.computeBoundingBox();
const tb = tub.boundingBox;
// put the case's own origin back: loop centre at (-1.5, 62.5) with r 5.75 => min x = -7.25
tubMesh.position.set(-7.25, 0, 0);
group.add(tubMesh);
const bezMesh = new THREE.Mesh(bez, bezMat);
bez.computeBoundingBox();
const explode = view === 'exploded' ? 16 : 0;
// exported with its bounds moved to the origin: put its back (z = 18.5) and centre back in place
const bb = bez.boundingBox;
bezMesh.position.set(22.5 - (bb.max.x + bb.min.x) / 2, 30.5 - (bb.max.y + bb.min.y) / 2, 18.5 + explode);
group.add(bezMesh);
// the CoreInk, for context
if (view !== 'tub' && view !== 'bezel') {
  const dev = new THREE.Mesh(new THREE.BoxGeometry(40, 56, 16), devMat);
  dev.position.set(22.5, 30.5, 2.5 + 8 + (view === 'exploded' ? 8 : 0));
  group.add(dev);
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(28.8, 29), scrMat);
  scr.position.set(22.5, 58.5 - 25, 18.52 + (view === 'exploded' ? 8 : 0));
  group.add(scr);
}
if (view === 'tub') bezMesh.visible = false;
if (view === 'bezel') { tubMesh.visible = false; group.children.forEach(m => { if (m !== bezMesh) m.visible = false; }); }
group.position.set(-22.5, -30.5, -10.5);
const cam = new THREE.PerspectiveCamera(30, W / H, 1, 1000);
const views = {
  front: [70, 55, 170], facets: [-60, 80, 150], bezel: [-95, 25, 95], back: [-90, 50, -150], tub: [80, 70, 150], exploded: [150, 40, 120], right: [170, 10, 40], top: [20, 170, 60]
};
const p = views[view] || views.front;
cam.position.set(...p);
cam.lookAt(0, 0, view === 'exploded' ? 8 : view === 'bezel' ? 10 : 0);
renderer.render(scene, cam);
document.title = 'done';
</script></body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script type="importmap">{"imports": {"three": "./node_modules/three/build/three.module.js",
 "three/addons/": "./node_modules/three/examples/jsm/"}}</script>
<style>body{margin:0;background:#f4f4f2}canvas{display:block}</style></head>
<body>
<script type="module">
// Renders hardware/case/case.py's parts in model coordinates (mm): X across, Y up, Z out of the screen.
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
const W = 640, H = 560;
const view = new URLSearchParams(location.search).get('view') || 'front';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2);
renderer.setSize(W, H);
renderer.setClearColor(0xf4f4f2);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x50565f, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 3.2); key.position.set(-110, 90, 80); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.8); fill.position.set(90, 20, -60); scene.add(fill);
const loader = new STLLoader();
const load = (f) => new Promise((ok, bad) => loader.load(f, g => { g.computeVertexNormals(); ok(g); }, undefined, bad));
const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.7, ...extra });
const add = async (file, material, offset = [0, 0, 0]) => {
  const m = new THREE.Mesh(await load(file), material); m.position.set(...offset); group.add(m); return m;
};
const group = new THREE.Group(); scene.add(group);
const exploded = view === 'exploded';
await add('model-tub.stl', mat(0x3b3f46));
await add('model-bezel.stl', mat(0x6a717b, { flatShading: true }), [0, 0, exploded ? 16 : 0]);
if (view !== 'tub' && view !== 'bezel' && view !== 'mount') {
  const dz = exploded ? 8 : 0;
  const dev = new THREE.Mesh(new THREE.BoxGeometry(40, 56, 16), mat(0xe9e9e4, { roughness: 0.5 }));
  dev.position.set(22.5, 30.5, 10.5 + dz); group.add(dev);
  const tex = new THREE.TextureLoader().load('screen.png');
  tex.colorSpace = THREE.SRGBColorSpace;
  await new Promise(r => setTimeout(r, 300));
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(27.6, 27.6), new THREE.MeshBasicMaterial({ map: tex }));
  scr.position.set(22.5, 58.5 - 25, 18.55 + dz); group.add(scr);
}
if (view.startsWith('cord')) {
  await add('model-cord.stl', mat(0x2f5d8a, { roughness: 0.9 }));
  await add('model-cordlock.stl', mat(0x222428, { roughness: 0.5 }));
}
if (view.startsWith('broom')) {
  await add('model-handle.stl', mat(0xc9a46a, { roughness: 0.55 }));
  await add('model-band.stl', mat(0xd9542b, { roughness: 0.45 }));
}
if (view === 'bezel') group.children[0].visible = false;
group.position.set(-22.5, -30.5, -10.5);
const views = {
  front: [[70, 55, 170], [0, 0, 0]], tub: [[80, 70, 150], [0, 0, 0]], exploded: [[150, 40, 120], [0, 0, 8]],
  right: [[170, 10, 40], [0, 0, 0]], bezel: [[-95, 25, 95], [0, 0, 10]],
  mount: [[-150, 55, -95], [0, 0, -6]],
  back: [[-30, 20, -175], [0, 0, -6]],
  rocker: [[115, 30, 25], [22, 9, 0]],
  cord: [[-80, 95, 360], [0, 60, 0]],
  'cord-close': [[-120, 45, 70], [-18, 12, -2]],
  broom: [[150, 120, 160], [0, -10, -10]],
  'broom-end': [[10, 230, 25], [0, 0, -12]],
  'broom-side': [[210, 25, -20], [0, 0, -14]],
};
const [pos, look] = views[view] || views.front;
const cam = new THREE.PerspectiveCamera(30, W / H, 1, 2000);
cam.position.set(...pos);
cam.lookAt(...look);
renderer.render(scene, cam);
document.title = 'done';
</script></body></html>

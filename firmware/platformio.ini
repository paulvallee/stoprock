; stoprock firmware
;
;   pio run -e coreink -t upload     build and flash the M5Stack CoreInk
;   pio run -e emu                   build for Espressif's esp-emulator (see ../simulator)
;   pio test -e native               run the logic tests on this computer
;   pio run -e render                draw the screens to PBM files (tools/compare_render.py)

[platformio]
default_envs = coreink

[env]
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[esp32_common]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200

[env:coreink]
extends = esp32_common
board = m5stack-coreink
lib_deps =
    m5stack/M5Unified@^0.2.7
build_flags =
    ${env.build_flags}
    -DSTOPROCK_BOARD_COREINK
build_src_filter = +<*> -<board_emu.cpp> -<render_main.cpp>

; esp-emulator runs ESP32-S3 firmware (not the original ESP32 in the CoreInk), so the
; simulator build targets an S3 with the same application code and a console-based board.
[env:emu]
extends = esp32_common
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DSTOPROCK_BOARD_EMU
build_src_filter = +<*> -<board_coreink.cpp> -<render_main.cpp>
extra_scripts = post:scripts/merge_bin.py

[env:native]
platform = native
test_framework = unity
lib_compat_mode = off
build_src_filter = -<*>

[env:render]
platform = native
lib_compat_mode = off
build_src_filter = +<render_main.cpp>
